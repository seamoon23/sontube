name: Android Debug APK

on:
  push:
    paths:
      - "android-client/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    paths:
      - "android-client/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Lint and build debug-only APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache and validate wrappers
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Allow Gradle wrapper execution
        run: chmod +x android-client/gradlew

      - name: Lint and build debug APK
        working-directory: android-client
        run: ./gradlew lintDebug assembleDebug --no-daemon --stacktrace

      # Uses Android's standard debug signing only; never use this artifact for a store release.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sontube-android-debug-only-${{ github.sha }}
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
