name: Android Logic CI

on:
  push:
    paths:
      - "android-client/**"
      - "app/api/app/**"
      - "lib/app-catalog.ts"
      - "lib/app-sync.ts"
      - "contracts/**"
      - "prisma/**"
      - "scripts/verify-android-logic.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-logic-ci.yml"
  pull_request:
    paths:
      - "android-client/**"
      - "app/api/app/**"
      - "lib/app-catalog.ts"
      - "lib/app-sync.ts"
      - "contracts/**"
      - "prisma/**"
      - "scripts/verify-android-logic.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-logic-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-logic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android policy logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android policy logic
        run: npm run verify:android:logic
